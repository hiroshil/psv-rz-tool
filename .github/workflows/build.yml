name: Build binaries

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Portable Linux x86_64 binary: static musl build works on most Linux distros.
          - name: linux-x86_64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: rz-tool

          # Native Windows x86_64 binary.
          - name: windows-x86_64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rz-tool.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install Linux musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build release binary
        run: cargo build --release --package rz-tool --target ${{ matrix.target }}

      - name: Preparing Linux binary
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/
          cp target/${{ matrix.target }}/release/rz-tool dist/${{ matrix.bin }}
          cp LICENSE dist/LICENSE
          chmod +x dist/${{ matrix.bin }}

      - name: Preparing Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/ | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rz-tool.exe" "dist/${{ matrix.bin }}"
          Copy-Item "LICENSE" "dist/LICENSE"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.bin }}
            dist/LICENSE
          if-no-files-found: error
